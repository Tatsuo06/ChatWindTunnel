[project]
name = "chatwt"
version = "0.1.0"
description = "Chat-based wind tunnel simulation with OpenFOAM"
requires-python = ">=3.11"

dependencies = [
    # Backend
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-jose[cryptography]>=3.3",
    "python-multipart>=0.0.9",
    "bcrypt>=4.0",
    # LLM
    "litellm>=1.40",
    # OpenFOAM case management
    "foamlib>=0.8",
    # CAD conversion
    "cadquery>=2.4",
    "numpy-stl>=3.1",
    "scipy>=1.13",
    # Visualization
    "pyvista>=0.44",
    "plotly>=5.22",
    "pillow>=10.3",
    "pandas>=2.2",
    # SSH / cluster
    "paramiko>=3.4",
    # Frontend
    "streamlit>=1.36",
    "requests>=2.32",
    "kaleido>=1.3.0",
    "aiosqlite>=0.22.1",
    "trimesh>=4.12.2",
    "networkx>=3.6.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "aiosqlite>=0.22",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend", "frontend"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "watchdog>=6.0.0",
]

